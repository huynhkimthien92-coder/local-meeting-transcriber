name: Build ứng dụng desktop (Windows + macOS + Linux)

# Chạy hoàn toàn trên máy chủ GitHub — Thiên không cần cài Rust/Tauri/Node/
# Python hay gõ lệnh gì trên máy mình. Chỉ cần:
#   1. Đẩy code lên GitHub (qua GitHub Desktop, không cần dòng lệnh — xem
#      hướng dẫn Claude đã đưa).
#   2. Vào tab "Actions" trên trang GitHub của repo, bấm nút "Run workflow"
#      (hoặc tự chạy mỗi khi có commit mới vào nhánh main).
#   3. Đợi build xong (khoảng 10-20 phút cho cả 3 nền tảng), vào trang kết
#      quả chạy, mục "Artifacts" ở cuối trang để tải file cài đặt về.
#
# Mỗi máy ảo (matrix bên dưới) tự đóng gói backend Python (PyInstaller) và
# tự tải đúng bản Ollama cho hệ điều hành của nó — không cần chuẩn bị sẵn
# file binary nào trong repo, tránh phải upload file nặng lên GitHub.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ollama_asset: ollama-darwin.tgz
          - os: windows-latest
            ollama_asset: ollama-windows-amd64.zip
          - os: ubuntu-latest
            # Ollama đã đổi định dạng nén cho bản Linux từ .tgz (gzip) sang
            # .tar.zst (zstd) kể từ các bản release gần đây — tên file cũ
            # "ollama-linux-amd64.tgz" không còn tồn tại trên GitHub Releases
            # nữa (đó là lý do curl chỉ tải về 9 byte: trang lỗi 404 của
            # GitHub, không phải file thật). Xác nhận lại tên file chính xác
            # tại https://github.com/ollama/ollama/releases nếu Ollama đổi
            # lần nữa trong tương lai.
            ollama_asset: ollama-linux-amd64.tar.zst
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runner của GitHub có sẵn Git Bash — dùng chung 1 cú pháp
        # bash cho cả 3 hệ điều hành thay vì viết riêng PowerShell.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Giải phóng dung lượng đĩa (chỉ Linux)
        # Máy ảo Ubuntu của GitHub cài sẵn nhiều thứ không dùng tới trong dự
        # án này (Android SDK, .NET, GHC, cache Docker...) chiếm hàng chục GB.
        # PyInstaller đóng gói các gói AI nặng (torch, pyannote.audio...)
        # thành 1 file cần khá nhiều dung lượng tạm lúc build -> dễ hết chỗ
        # nếu không dọn trước (lỗi thật đã gặp: "No space left on device").
        # Windows/macOS runner của GitHub có sẵn nhiều đĩa trống hơn nên
        # không cần bước này.
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/heroku /usr/lib/jvm /usr/local/julia* \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy || true
          sudo docker image prune -af || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean || true
          df -h /

      - name: Cài Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện hệ thống cho Tauri (chỉ Linux cần)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev zstd

      - name: Xác định target triple của máy build này
        id: triple
        run: echo "triple=$(rustc -vV | grep host | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Đóng gói backend Python thành 1 binary (PyInstaller)
        run: |
          cd backend
          # QUAN TRỌNG: pyannote.audio (tách giọng nói) phụ thuộc "torch" --
          # nếu cài "pip install -r requirements.txt" bình thường, pip sẽ tự
          # tải bản torch có kèm CUDA (hỗ trợ GPU NVIDIA) nặng 2-3GB, dù app
          # này mặc định chỉ chạy CPU (diarization/GPU không bắt buộc). Cài
          # trước bản torch CPU-only (nhẹ hơn nhiều) từ index riêng của
          # PyTorch để pip không tải nhầm bản CUDA nặng khi resolve
          # dependency của pyannote.audio ở bước sau -- đây là nguyên nhân
          # chính khiến file cài đặt Windows quá nặng, vỡ cả NSIS lẫn MSI.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller
          # QUAN TRỌNG: --collect-data faster_whisper -- PyInstaller mặc định
          # CHỈ đóng gói code Python (.py), KHÔNG tự biết đóng gói kèm các
          # file dữ liệu không phải code nằm trong thư viện (vd model VAD
          # "silero_vad_v6.onnx" mà faster-whisper cần để phát hiện đoạn có
          # tiếng nói) -- lỗi thật đã gặp lúc chạy app trên Windows:
          # "[ONNXRuntimeError]... Load model ...silero_vad_v6.onnx failed.
          # File doesn't exist". Cờ này bảo PyInstaller gói kèm TOÀN BỘ file
          # dữ liệu đi cùng thư viện faster_whisper, không riêng code.
          # Tương tự, pyannote.audio (nhận diện người nói) cũng có file dữ
          # liệu không phải code nằm trong thư viện (vd "telemetry/config.yaml")
          # mà PyInstaller không tự gói -- lỗi thật đã gặp:
          # "[Errno 2] No such file or directory: ...pyannote\audio\telemetry
          # \config.yaml". Thêm --collect-data pyannote để gói kèm luôn.
          pyinstaller --onefile --name meeting-backend --collect-data faster_whisper --collect-data pyannote run_server.py
          mkdir -p ../frontend/src-tauri/binaries
          BIN="dist/meeting-backend"
          [ -f "dist/meeting-backend.exe" ] && BIN="dist/meeting-backend.exe"
          EXT=""; [[ "$BIN" == *.exe ]] && EXT=".exe"
          cp "$BIN" "../frontend/src-tauri/binaries/meeting-backend-${{ steps.triple.outputs.triple }}${EXT}"
          echo "Kích thước backend đóng gói: $(du -h "$BIN" | cut -f1)"

      - name: Tải AI engine (Ollama) đúng bản cho hệ điều hành này
        run: |
          mkdir -p frontend/src-tauri/binaries
          curl -fL -o ollama_asset "https://github.com/ollama/ollama/releases/latest/download/${{ matrix.ollama_asset }}"
          # Kiểm tra file tải về có thực sự lớn không (phòng trường hợp
          # GitHub đổi tên asset lần nữa trong tương lai và curl chỉ tải về
          # 1 trang lỗi nhỏ thay vì file binary thật -> build sẽ báo lỗi rõ
          # ràng ở đây thay vì lỗi khó hiểu lúc giải nén).
          size=$(wc -c < ollama_asset)
          echo "Kích thước file tải về: $size byte"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::File Ollama tải về quá nhỏ ($size byte) - có thể tên file asset đã đổi. Kiểm tra lại https://github.com/ollama/ollama/releases"
            exit 1
          fi
          mkdir -p ollama_extracted
          case "${{ matrix.ollama_asset }}" in
            *.zip) unzip -o ollama_asset -d ollama_extracted ;;
            *.tgz) tar -xzf ollama_asset -C ollama_extracted ;;
            *.tar.zst) tar --use-compress-program=unzstd -xf ollama_asset -C ollama_extracted ;;
          esac
          SRC=$(find ollama_extracted -type f \( -iname "ollama" -o -iname "ollama.exe" \) | head -n1)
          EXT=""; [[ "$SRC" == *.exe ]] && EXT=".exe"
          cp "$SRC" "frontend/src-tauri/binaries/ollama-${{ steps.triple.outputs.triple }}${EXT}"
          chmod +x "frontend/src-tauri/binaries/ollama-${{ steps.triple.outputs.triple }}${EXT}" || true

          # QUAN TRỌNG: "ollama(.exe)" chỉ là vỏ điều khiển -- phần THỰC SỰ
          # chạy model (llama-server + các thư viện backend CPU/GPU) nằm
          # trong thư mục con "lib/ollama/" đi kèm bản tải chính thức.
          # externalBin của Tauri chỉ mang được đúng 1 file thực thi, không
          # mang theo thư mục này -> phải copy riêng "lib/" vào
          # resources/lib để tauri.conf.json đóng gói kèm installer, rồi
          # main.rs trỏ OLLAMA_LIBRARY_PATH vào đó lúc chạy (lỗi thật đã
          # gặp trên Windows: "llama-server binary not found").
          mkdir -p frontend/src-tauri/resources/lib
          LIB_DIR=$(find ollama_extracted -type d -iname "lib" | head -n1)
          if [ -n "$LIB_DIR" ]; then
            cp -r "$LIB_DIR"/. frontend/src-tauri/resources/lib/
            echo "Đã copy thư mục lib Ollama ($LIB_DIR) vào resources/lib"

            # QUAN TRỌNG: bản Ollama tải về kèm SẴN nhiều backend GPU khác
            # nhau trong lib/ollama/ — thực tế đã gặp trên Windows: 2 bản
            # CUDA gần trùng nhau (cuda_v12/, cuda_v13/ — chỉ khác driver
            # NVIDIA hỗ trợ) CHIẾM PHẦN LỚN dung lượng (mỗi bản có sẵn
            # cublas64.dll rất nặng), cộng thêm vulkan/ (nhẹ hơn nhiều).
            # Tổng cả thư mục ~1.8GB -> vượt giới hạn thực tế của WiX/MSI
            # (công cụ "light.exe" đóng gói .msi trên Windows) về dung
            # lượng + độ dài đường dẫn -> đây là nghi vấn chính gây lỗi
            # "light.exe" không rõ nguyên nhân đã gặp.
            #
            # Chỉ xoá cuda_v*/ (CUDA — riêng cho GPU NVIDIA, là phần nặng
            # nhất), GIỮ LẠI vulkan/ — Vulkan là chuẩn đồ hoạ chung nên vẫn
            # tăng tốc GPU được cho cả NVIDIA/AMD/Intel, mà nhẹ hơn CUDA rất
            # nhiều -> vừa giảm mạnh dung lượng vừa không cắt hết tính năng
            # GPU của người dùng có card rời.
            echo "Kích thước từng thư mục con trong lib/ollama trước khi cắt bớt:"
            du -sh frontend/src-tauri/resources/lib/ollama/*/ 2>/dev/null || true
            find frontend/src-tauri/resources/lib -maxdepth 2 -type d \
              \( -iname "cuda_v*" -o -iname "*nvidia*" \) \
              -exec echo "Xoá (CUDA - chỉ NVIDIA dùng được, đã có Vulkan thay thế):" {} \; \
              -exec rm -rf {} +
          else
            echo "Không thấy thư mục lib riêng trong bản Ollama này (bình thường với một số nền tảng, vd macOS dùng 1 file duy nhất) -- bỏ qua."
          fi
          # Giữ resources/lib luôn tồn tại (kể cả rỗng) để tauri.conf.json
          # không lỗi lúc build vì thiếu đường dẫn resources đã khai báo.
          touch frontend/src-tauri/resources/lib/.gitkeep
          echo "Kích thước thư mục lib Ollama: $(du -sh frontend/src-tauri/resources/lib | cut -f1)"

          # Bản Linux nén bằng zstd nặng hơn hẳn bản cũ (~1.3GB thay vì
          # ~100MB) -> xoá ngay file nén + thư mục giải nén tạm sau khi đã
          # lấy được binary cần dùng, tránh chiếm thêm dung lượng đĩa cho
          # các bước build Tauri phía sau (máy ảo Ubuntu vốn đã eo hẹp đĩa).
          rm -rf ollama_asset ollama_extracted

      - name: Cài dependencies frontend
        run: cd frontend && npm install

      - name: Build app Tauri (ra file cài đặt .msi / .dmg / .AppImage)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend

      - name: Lưu file cài đặt để tải về (mục Artifacts cuối trang kết quả)
        uses: actions/upload-artifact@v4
        with:
          name: bien-ban-hop-${{ matrix.os }}
          path: |
            frontend/src-tauri/target/release/bundle/**/*.msi
            frontend/src-tauri/target/release/bundle/**/*.dmg
            frontend/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
