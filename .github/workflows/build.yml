name: Build ứng dụng desktop (Windows + macOS + Linux)

# Chạy hoàn toàn trên máy chủ GitHub — Thiên không cần cài Rust/Tauri/Node/
# Python hay gõ lệnh gì trên máy mình. Chỉ cần:
#   1. Đẩy code lên GitHub (qua GitHub Desktop, không cần dòng lệnh — xem
#      hướng dẫn Claude đã đưa).
#   2. Vào tab "Actions" trên trang GitHub của repo, bấm nút "Run workflow"
#      (hoặc tự chạy mỗi khi có commit mới vào nhánh main).
#   3. Đợi build xong (khoảng 10-20 phút cho cả 3 nền tảng), vào trang kết
#      quả chạy, mục "Artifacts" ở cuối trang để tải file cài đặt về.
#
# Mỗi máy ảo (matrix bên dưới) tự đóng gói backend Python (PyInstaller) và
# tự tải đúng bản Ollama cho hệ điều hành của nó — không cần chuẩn bị sẵn
# file binary nào trong repo, tránh phải upload file nặng lên GitHub.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ollama_asset: ollama-darwin.tgz
          - os: windows-latest
            ollama_asset: ollama-windows-amd64.zip
          - os: ubuntu-latest
            ollama_asset: ollama-linux-amd64.tgz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runner của GitHub có sẵn Git Bash — dùng chung 1 cú pháp
        # bash cho cả 3 hệ điều hành thay vì viết riêng PowerShell.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện hệ thống cho Tauri (chỉ Linux cần)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Xác định target triple của máy build này
        id: triple
        run: echo "triple=$(rustc -vV | grep host | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Đóng gói backend Python thành 1 binary (PyInstaller)
        run: |
          cd backend
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --name meeting-backend run_server.py
          mkdir -p ../frontend/src-tauri/binaries
          BIN="dist/meeting-backend"
          [ -f "dist/meeting-backend.exe" ] && BIN="dist/meeting-backend.exe"
          EXT=""; [[ "$BIN" == *.exe ]] && EXT=".exe"
          cp "$BIN" "../frontend/src-tauri/binaries/meeting-backend-${{ steps.triple.outputs.triple }}${EXT}"

      - name: Tải AI engine (Ollama) đúng bản cho hệ điều hành này
        run: |
          mkdir -p frontend/src-tauri/binaries
          curl -L -o ollama_asset "https://github.com/ollama/ollama/releases/latest/download/${{ matrix.ollama_asset }}"
          mkdir -p ollama_extracted
          case "${{ matrix.ollama_asset }}" in
            *.zip) unzip -o ollama_asset -d ollama_extracted ;;
            *.tgz) tar -xzf ollama_asset -C ollama_extracted ;;
          esac
          SRC=$(find ollama_extracted -type f \( -iname "ollama" -o -iname "ollama.exe" \) | head -n1)
          EXT=""; [[ "$SRC" == *.exe ]] && EXT=".exe"
          cp "$SRC" "frontend/src-tauri/binaries/ollama-${{ steps.triple.outputs.triple }}${EXT}"
          chmod +x "frontend/src-tauri/binaries/ollama-${{ steps.triple.outputs.triple }}${EXT}" || true

      - name: Cài dependencies frontend
        run: cd frontend && npm install

      - name: Build app Tauri (ra file cài đặt .exe / .dmg / .AppImage / .deb)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend

      - name: Lưu file cài đặt để tải về (mục Artifacts cuối trang kết quả)
        uses: actions/upload-artifact@v4
        with:
          name: bien-ban-hop-${{ matrix.os }}
          path: |
            frontend/src-tauri/target/release/bundle/**/*.exe
            frontend/src-tauri/target/release/bundle/**/*.dmg
            frontend/src-tauri/target/release/bundle/**/*.AppImage
            frontend/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
